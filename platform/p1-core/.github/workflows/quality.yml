name: Quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot-acceptance:
    name: Better Farms pilot acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out Core
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out reviewed Better Farms source
        uses: actions/checkout@v7
        with:
          repository: Go-Digital-Alchemy-Repos/Better-Farms
          ref: 7fd1298beb373ee447aa97f578fb11e575faf8f0
          path: .pilot-source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Core dependencies
        run: npm ci

      - name: Install pinned Better Farms dependencies
        working-directory: .pilot-source
        run: npm ci

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Verify actual two-origin pilot
        env:
          PILOT_SITE_ROOT: ${{ github.workspace }}/.pilot-source
        run: npx playwright test --config playwright.pilot.config.ts

      - name: Preserve pilot failure and receipt evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: better-farms-pilot-evidence
          path: test-results/pilot/
          if-no-files-found: warn
          retention-days: 14

  verify:
    name: Verify
    needs: pilot-acceptance
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: core_platform_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d core_platform_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Require successful pilot acceptance
        env:
          PILOT_RESULT: ${{ needs.pilot-acceptance.result }}
        run: test "$PILOT_RESULT" = success

      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/core_platform_ci
        run: >-
          npx tsx -e 'import { runMigrations } from "./server/migrate.ts";
          import { pool } from "./server/db.ts";
          (async () => { try { await runMigrations(); await runMigrations(); }
          finally { await pool.end(); } })().catch(error => { console.error(error); process.exitCode = 1; });'

      - name: Type-check
        run: npm run check

      - name: Rehearse populated production-baseline upgrade
        timeout-minutes: 8
        run: |
          git fetch --no-tags --depth=1 origin a006f36a3c4f37566c71b278d561844b45fb3b81
          python3 script/verify-populated-upgrade.py --baseline a006f36a3c4f37566c71b278d561844b45fb3b81 --output test-results/populated-upgrade.json

      - name: Lint
        run: npm run lint

      - name: Verify formatting
        run: npm run format

      - name: Run tests
        run: npm test

      - name: Create disposable reliability databases
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: >-
          node --input-type=module -e 'import pg from "pg";
          const pool = new pg.Pool();
          try { for (const name of ["core_backup_test", "core_form_effect_test", "core_reservation_expiry_test", "core_browser_test", "core_settings_test"])
          await pool.query(`CREATE DATABASE ${name}`); } finally { await pool.end(); }'

      - name: Verify database reliability across timezones
        env:
          BACKUP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/core_backup_test
          FORM_EFFECT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/core_form_effect_test
          RESERVATION_EXPIRY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/core_reservation_expiry_test
        run: |
          for timezone in America/New_York UTC; do
            TZ="$timezone" npx vitest run server/services/system-backup.database.test.ts server/storage/forms-effects.database.test.ts server/storage/ecommerce-reservation-expiry.database.test.ts
          done

      - name: Verify atomic settings persistence
        env:
          SETTINGS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/core_settings_test
        run: npx vitest run server/__tests__/settings-atomic.db.test.ts

      - name: Build production bundle
        run: npm run build

      - name: Verify standalone upload command
        run: python3 script/verify-upload-verifier-artifact.py

      - name: Verify standalone upload apply command
        run: python3 script/verify-upload-apply-artifact.py

      - name: Enforce bundle budgets
        run: npm run budget

      - name: Verify compiled production startup and drainage
        timeout-minutes: 8
        run: python3 script/verify-production-runtime.py --output test-results/production-runtime.json

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Verify real application browser journeys
        env:
          BROWSER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/core_browser_test
        run: npx playwright test --config playwright.app.config.ts

      - name: Preserve release rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: production-runtime-evidence
          path: |
            test-results/production-runtime.json
            test-results/populated-upgrade.json
          if-no-files-found: warn
          retention-days: 14
