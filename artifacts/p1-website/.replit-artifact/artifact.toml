kind = "web"
previewPath = "/"
title = "P1 Land & Property Management"
version = "1.0.0"
id = "artifacts/p1-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22816

[services.development]
run = "pnpm --filter @workspace/p1-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/p1-website", "run", "build" ]
publicDir = "artifacts/p1-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22816"
BASE_PATH = "/"
