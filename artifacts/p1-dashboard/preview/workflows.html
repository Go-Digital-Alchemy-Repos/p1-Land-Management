<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>P1 Dashboard workflow preview</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17253b;background:#f8fafc;--blue:#2766ab;--line:#dde5ee;--soft:#f0f5fa}
    *{box-sizing:border-box}button,a,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}
    :focus-visible{outline:3px solid #2766ab;outline-offset:3px}.app{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:27px 16px;display:flex;flex-direction:column;gap:32px}.brand{display:flex;align-items:center;gap:11px;padding:3px 8px;font-size:11px;font-weight:800;letter-spacing:.11em;line-height:1.5}.brand-mark{font-family:Georgia,serif;font-size:39px;color:var(--blue);letter-spacing:-.15em}.side nav{display:grid;gap:5px}.group{font-size:10px;letter-spacing:.18em;font-weight:800;color:#708096;margin:18px 10px 8px}.nav-link{border-radius:10px;padding:10px 12px;display:flex;gap:11px;align-items:center;font-size:13px;font-weight:640}.nav-link:hover,.nav-link.active{background:var(--soft);text-decoration:none}.glyph{font-size:17px;width:20px;text-align:center}.glyph.blue{color:#2b70d4}.glyph.green{color:#169c66}.glyph.violet{color:#9264db}.glyph.amber{color:#d88923}.glyph.rose{color:#df577b}.user{margin-top:auto;border-top:1px solid var(--line);padding:18px 8px 0;font-size:12px;color:#57687d}.main{min-width:0}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,3vw,45px);font-size:12px}.role-picker{display:flex;align-items:center;gap:10px}.role-picker select{border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px;color:#17253b}.content{max-width:1380px;margin:auto;padding:35px clamp(18px,3vw,45px) 75px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.2em;color:#6a7b90;margin:0 0 9px}h1{font-size:clamp(28px,3vw,40px);letter-spacing:-.05em;line-height:1.12;margin:0 0 9px}h2{font-size:18px;letter-spacing:-.025em;margin:0}h3{font-size:15px;margin:0}.muted{color:#65758a}.intro{margin:0 0 28px;color:#65758a}.head-row{display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}.button{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 14px;font-size:12px;font-weight:700;min-height:42px}.button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.button:hover{box-shadow:0 3px 10px #1734551c}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow:auto;margin:26px 0 24px}.tab{border:0;border-bottom:2px solid transparent;background:transparent;white-space:nowrap;padding:13px 14px;font-size:12px;font-weight:680;color:#66758b}.tab.active{color:var(--blue);border-bottom-color:var(--blue)}.panel{border:1px solid var(--line);background:#fff;border-radius:14px;padding:20px;box-shadow:0 1px 3px #17253b08}.panel+.panel{margin-top:16px}.panel-head{display:flex;justify-content:space-between;align-items:start;gap:15px;margin-bottom:16px}.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(270px,.8fr);gap:18px}.stack{display:grid;gap:18px;align-content:start}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px}.stat strong{display:block;font-size:27px;margin:7px 0}.stat small{color:#65758a}.list{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:11px;padding:15px;display:flex;justify-content:space-between;gap:12px;align-items:start}.item:hover{border-color:#89afd6;background:#f8fbfe}.item p{margin:5px 0 0;color:#65758a;font-size:12px}.pill{border-radius:30px;padding:6px 10px;background:#eaf2fb;color:#235f9f;font-size:11px;font-weight:800;white-space:nowrap}.pill.green{background:#e9f7ef;color:#1a8a55}.pill.amber{background:#fff3e5;color:#a76514}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.facts dt{font-size:11px;color:#65758a;margin-bottom:4px}.facts dd{font-size:13px;font-weight:650;margin:0}.big{font-size:17px;font-weight:650;line-height:1.5;margin:22px 0}.journey{list-style:none;padding:0;margin:18px 0;display:grid;gap:15px;font-size:13px}.journey span{color:#1d945d;margin-right:10px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:7px;font-size:12px;font-weight:700}input,textarea,select{font:inherit;width:100%;border:1px solid #cdd9e5;border-radius:9px;background:#fff;padding:11px;color:#17253b}textarea{min-height:95px;resize:vertical}.form-actions{display:flex;gap:9px;margin-top:18px}.notice{border-left:3px solid var(--blue);background:#eef5fc;border-radius:7px;padding:13px 15px;font-size:12px;line-height:1.5}.kanban{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:15px}.column{background:#eef3f8;border:1px solid var(--line);border-radius:13px;padding:13px}.column h2{margin:4px 4px 14px}.column .item{background:#fff}.hidden{display:none!important}.mobile-toggle{display:none}
    @media(max-width:950px){.app{grid-template-columns:70px minmax(0,1fr)}.brand span:last-child,.group,.nav-link span:last-child,.user{display:none}.side{padding-inline:11px}.brand{padding:0;justify-content:center}.nav-link{justify-content:center}.grid{grid-template-columns:1fr}.kanban{overflow-x:auto;grid-template-columns:repeat(3,240px)}}
    @media(max-width:650px){.app{display:block}.side{display:none}.mobile-toggle{display:inline-flex}.top{height:57px}.content{padding:25px 16px 65px}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:span 2}.facts,.form-grid{grid-template-columns:1fr}.panel{padding:17px}.role-picker span{display:none}}
    .role-picker>span{white-space:nowrap}[hidden]{display:none!important}
  </style>
</head>
<body>
<div class="app">
  <aside class="side"><div class="brand"><span class="brand-mark">P1</span><span>LAND &amp; PROPERTY<br>OPERATIONS WORKSPACE</span></div><nav aria-label="Preview navigation"><div class="group">WORKSPACE</div><a class="nav-link" href="#overview"><span class="glyph blue">▦</span><span>Overview</span></a><div class="group">CUSTOMERS</div><a class="nav-link" href="#clients"><span class="glyph green">♧</span><span>Clients</span></a><a class="nav-link" href="#portal"><span class="glyph green">♧</span><span>Your properties</span></a><div class="group">OPERATIONS</div><a class="nav-link" href="#dispatch"><span class="glyph violet">▤</span><span>My day</span></a><a class="nav-link" href="#crew"><span class="glyph violet">▤</span><span>Today's work</span></a><div class="group">REVENUE</div><a class="nav-link" href="#sales"><span class="glyph blue">▣</span><span>Sales</span></a><a class="nav-link" href="#finance"><span class="glyph amber">▱</span><span>Billing</span></a><div class="group">MARKETING &amp; SETTINGS</div><a class="nav-link" href="#marketing"><span class="glyph rose">✿</span><span>Content</span></a><a class="nav-link" href="#settings"><span class="glyph green">⚙</span><span>Settings</span></a></nav><div class="user">Synthetic design preview<br>No live records or writes</div></aside>
  <main class="main"><header class="top"><span><button class="button mobile-toggle" type="button" id="menu">☰</button> P1 · Dashboard preview</span><div class="role-picker"><span>View as</span><select id="role" aria-label="Preview role"><option value="owner">Owner</option><option value="sales">Sales</option><option value="dispatch">Dispatch</option><option value="finance">Finance</option><option value="crew">Crew</option><option value="client">Client</option></select></div></header><div class="content" id="content"></div></main>
</div>
<script>
const content=document.getElementById('content');
const role=document.getElementById('role');
const lead='Test Lead';
const screens={
  overview:`<p class="eyebrow">WORKSPACE</p><h1>Good afternoon</h1><p class="intro">Work that needs your attention, organized by your role.</p><div class="stats"><div class="stat"><small>Needs a reply</small><strong>2</strong><a href="#sales">Open Sales →</a></div><div class="stat"><small>Scheduled today</small><strong>3</strong><a href="#dispatch">Open My day →</a></div><div class="stat"><small>Billing review</small><strong>1</strong><a href="#finance">Open Billing →</a></div></div><section class="panel"><h2>Next actions</h2><div class="list" style="margin-top:16px"><a class="item" href="#lead"><span><strong>${lead}</strong><p>Confirm site assessment · due tomorrow</p></span><span class="pill">Sales</span></a><a class="item" href="#dispatch"><span><strong>North site visit</strong><p>Crew assignment needs review</p></span><span class="pill amber">Dispatch</span></a></div></section>`,
  sales:`<div class="head-row"><div><p class="eyebrow">REVENUE / SALES</p><h1>Sales</h1><p class="intro">Find the next decision, then work inside the inquiry profile.</p></div><button class="button primary" type="button">+ New inquiry</button></div><div class="stats"><div class="stat"><small>Needs a reply</small><strong>2</strong></div><div class="stat"><small>Assessments due</small><strong>1</strong></div><div class="stat"><small>Won, handoff pending</small><strong>1</strong></div></div><section class="panel"><div class="panel-head"><h2>Priority inquiries</h2><a href="#pipeline">View pipeline →</a></div><div class="list"><a class="item" href="#lead"><span><strong>${lead}</strong><p>Synthetic test property · confirm assessment</p></span><span class="pill">New</span></a><a class="item" href="#handoff"><span><strong>Sample won account</strong><p>Customer handoff needs review</p></span><span class="pill green">Won</span></a></div></section>`,
  pipeline:`<div class="head-row"><div><p class="eyebrow">REVENUE / SALES</p><h1>Pipeline</h1><p class="intro">Scan stages. Open a profile for the full record and next action.</p></div><a class="button" href="#sales">Sales overview</a></div><div class="kanban"><section class="column"><h2>New · 2</h2><a class="item" href="#lead"><span><strong>${lead}</strong><p>Synthetic test property<br>Confirm assessment</p></span><span>↗</span></a></section><section class="column"><h2>Proposal · 1</h2><a class="item" href="#lead"><span><strong>Sample prospect</strong><p>Proposal review due Friday</p></span><span>↗</span></a></section><section class="column"><h2>Won · 1</h2><a class="item" href="#handoff"><span><strong>Sample won account</strong><p>Review client handoff</p></span><span>↗</span></a></section></div>`,
  lead:`<a href="#sales" class="muted">← Sales overview</a><div class="head-row" style="margin-top:22px"><div><p class="eyebrow">SALES / INQUIRY PROFILE</p><h1>${lead}</h1><p class="intro">P1 system QA · synthetic location</p></div><span class="pill">New</span></div><nav class="tabs" aria-label="Inquiry sections"><button class="tab active" data-tab="lead">Overview</button><button class="tab" data-tab="followup">Follow-up</button><button class="tab" data-tab="activity">Activity</button><button class="tab" data-tab="assessment">Assessment</button><button class="tab" data-tab="handoff">Client handoff</button></nav><div class="grid"><div class="stack"><section class="panel"><div class="panel-head"><div><p class="eyebrow">NEXT STEP</p><h2>Keep this inquiry moving</h2></div><a href="#followup">Edit follow-up →</a></div><p class="big">Confirm the site assessment with the prospect.</p><dl class="facts"><div><dt>Owner</dt><dd>Unassigned</dd></div><div><dt>Due</dt><dd>Tomorrow, 10:00am</dd></div></dl></section><section class="panel"><div class="panel-head"><h2>What they told us</h2><a href="#assessment">Review assessment →</a></div><p class="muted">Synthetic lead used for workflow review. No customer contact.</p><dl class="facts"><div><dt>Property</dt><dd>Synthetic test property</dd></div><div><dt>Service</dt><dd>Site assessment</dd></div></dl></section><section class="panel"><h2>Agreement work</h2><p class="muted">No agreement draft is linked. Won and signing are tracked separately.</p></section></div><div class="stack"><section class="panel"><h2>Contact</h2><dl class="facts"><div><dt>Name</dt><dd>${lead}</dd></div><div><dt>Phone</dt><dd>(202) 555-0100</dd></div></dl></section><section class="panel"><h2>From lead to client</h2><ol class="journey"><li><span>✓</span>Inquiry received</li><li><span>○</span>Sales outcome in progress</li><li><span>○</span>Client handoff pending</li></ol><a href="#handoff">View handoff requirements →</a></section></div></div>`,
  followup:`<a href="#lead" class="muted">← Inquiry profile</a><p class="eyebrow" style="margin-top:24px">SALES OPERATIONS</p><h1>Owner, stage &amp; next action</h1><p class="intro">A focused edit with clear save and cancel behavior.</p><div class="panel" style="max-width:760px"><div class="form-grid"><label>Sales owner<select><option>Unassigned</option><option>Mike Dickerman</option></select></label><label>Inquiry stage<select><option>New</option><option>Contacted</option><option>Qualified</option><option>Proposal</option><option>Won</option></select></label><label style="grid-column:1/-1">Next action<textarea>Confirm the site assessment with the prospect.</textarea></label><label>Next action due<input type="datetime-local"></label></div><div class="form-actions"><button class="button primary" type="button" onclick="alert('Design preview only — no record was changed.')">Save changes</button><a class="button" href="#lead">Cancel</a></div></div>`,
  activity:`<a href="#lead" class="muted">← Inquiry profile</a><p class="eyebrow" style="margin-top:24px">SALES / ACTIVITY</p><h1>Activity &amp; tasks</h1><div class="grid"><section class="panel"><h2>Recent activity</h2><div class="list" style="margin-top:16px"><div class="item">Inquiry received · synthetic record</div><div class="item">Next action assigned · sample event</div></div></section><section class="panel"><h2>Follow-up tasks</h2><p class="muted">Keep task history with the inquiry.</p></section></div>`,
  assessment:`<a href="#lead" class="muted">← Inquiry profile</a><p class="eyebrow" style="margin-top:24px">SALES / ASSESSMENT</p><h1>Site assessment</h1><p class="intro">Property context, site observations and review live together.</p><div class="grid"><section class="panel"><h2>Prospect context</h2><p class="muted">Reported property is not yet a verified client property.</p></section><section class="panel"><h2>Assessment status</h2><p class="pill amber" style="display:inline-block">Needs review</p></section></div>`,
  handoff:`<a href="#lead" class="muted">← Inquiry profile</a><p class="eyebrow" style="margin-top:24px">CLIENT TRANSITION</p><h1>Review customer handoff</h1><p class="intro">After Won, link an existing customer or create one. The original inquiry remains in Sales.</p><div class="panel" style="max-width:780px"><p class="notice"><strong>Review first.</strong> Agreement signing, property setup, portal invitations and billing continue separately.</p><div class="form-grid" style="margin-top:18px"><label>Handoff choice<select><option>Link an existing customer</option><option>Create a new customer</option></select></label><label>Customer<select><option>Choose a customer</option><option>Sample client account</option></select></label></div><div class="form-actions"><button class="button primary" type="button" onclick="alert('Design preview only — no customer was linked.')">Review and link</button><a class="button" href="#lead">Cancel</a></div></div>`,
  clients:`<p class="eyebrow">CUSTOMERS</p><h1>Clients</h1><p class="intro">Portfolio first, details on each client profile.</p><section class="panel"><div class="panel-head"><h2>Client accounts</h2><button class="button">+ Add client</button></div><div class="list"><a class="item" href="#client"><span><strong>Sample client account</strong><p>2 properties · next visit Thursday</p></span><span>↗</span></a></div></section>`,
  client:`<a href="#clients" class="muted">← Clients</a><p class="eyebrow" style="margin-top:24px">CLIENT COMMAND CENTER</p><h1>Sample client account</h1><p class="intro">Properties, contacts, agreements and work in one record.</p><nav class="tabs"><button class="tab active">Overview</button><button class="tab">Properties</button><button class="tab">Contacts</button><button class="tab">Agreements</button><button class="tab">Schedule</button></nav><div class="grid"><section class="panel"><h2>Property portfolio</h2><p class="muted">Two operational properties.</p></section><section class="panel"><h2>Sales origin</h2><p class="muted">Internal staff can open the original inquiry. Client views never show internal Sales history.</p><a href="#lead">Open linked inquiry →</a></section></div>`,
  dispatch:`<p class="eyebrow">OPERATIONS / DISPATCH</p><h1>My day</h1><p class="intro">Visits, changes and items needing review in one focused queue.</p><div class="stats"><div class="stat"><small>Today</small><strong>3</strong></div><div class="stat"><small>Needs assignment</small><strong>1</strong></div><div class="stat"><small>Field updates</small><strong>2</strong></div></div><section class="panel"><h2>Today's visits</h2><div class="list" style="margin-top:16px"><div class="item"><span><strong>North site visit</strong><p>10:00am · crew assignment</p></span><span class="pill amber">Review</span></div></div></section>`,
  finance:`<p class="eyebrow">REVENUE / FINANCE</p><h1>Billing</h1><p class="intro">Review what is ready, with context behind each item.</p><div class="stats"><div class="stat"><small>Ready to review</small><strong>1</strong></div><div class="stat"><small>Needs agreement</small><strong>2</strong></div><div class="stat"><small>Recently sent</small><strong>4</strong></div></div><section class="panel"><h2>Billing preparation</h2><div class="list" style="margin-top:16px"><div class="item"><span><strong>Sample client account</strong><p>Service visit · pending review</p></span><span class="pill amber">Review</span></div></div></section>`,
  crew:`<p class="eyebrow">FIELD WORKSPACE</p><h1>Today's work</h1><p class="intro">Assigned visits and property information, without office-only Sales or billing controls.</p><section class="panel"><h2>Assigned visits</h2><div class="list" style="margin-top:16px"><div class="item"><span><strong>North site visit</strong><p>10:00am · access instructions available</p></span><span>↗</span></div></div></section>`,
  portal:`<p class="eyebrow">CLIENT PORTAL</p><h1>Your properties</h1><p class="intro">Upcoming work, requests and property records in one place.</p><section class="panel"><h2>Next service</h2><p class="big">Thursday at 10:00am</p><p class="muted">North property · grounds care</p></section>`,
  marketing:`<p class="eyebrow">MARKETING / CONTENT</p><h1>Website content</h1><p class="intro">Find a page, edit its draft, then review and publish through the existing CMS workflow.</p><section class="panel"><div class="panel-head"><h2>Pages</h2><button class="button">+ New page</button></div><label>Find website content<input type="search" placeholder="Search pages"></label><div class="list" style="margin-top:16px"><div class="item">Home page <span class="pill green">Published</span></div></div></section>`,
  settings:`<p class="eyebrow">SETTINGS</p><h1>User Manager</h1><p class="intro">Accounts, roles and access in a focused administrative workspace.</p><section class="panel"><h2>People</h2><p class="muted">Review a person's role and grants before changing access.</p></section>`
};
const allowed={owner:null,sales:['overview','sales','pipeline','lead','followup','activity','assessment','handoff','clients','client'],dispatch:['overview','dispatch','clients','client'],finance:['overview','finance','clients','client'],crew:['crew'],client:['portal']};
function render(){const chosen=role.value;let page=location.hash.slice(1)||'overview';if(!(page in screens))page='overview';if(allowed[chosen]&&!allowed[chosen].includes(page))page=chosen==='client'?'portal':chosen==='crew'?'crew':chosen==='finance'?'finance':chosen==='dispatch'?'dispatch':'sales';content.innerHTML=screens[page];document.querySelectorAll('.nav-link').forEach(a=>{a.hidden=Boolean(allowed[chosen]&&!allowed[chosen].includes(a.hash.slice(1)));a.classList.toggle('active',a.hash==='#'+page)});document.querySelectorAll('.tab[data-tab]').forEach(button=>button.onclick=()=>{location.hash=button.dataset.tab});document.title='P1 Dashboard preview · '+page[0].toUpperCase()+page.slice(1)}
role.onchange=render;window.addEventListener('hashchange',render);document.getElementById('menu').onclick=()=>{const side=document.querySelector('.side');side.style.display=side.style.display==='flex'?'none':'flex';side.style.position='absolute';side.style.zIndex='5';side.style.width='240px';side.style.boxShadow='0 15px 45px #17253b2b'};render();
</script>
</body>
</html>
